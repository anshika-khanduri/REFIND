{% extends "base.html" %}{% block title %}Create account{% endblock %}
{% block content %}<section class="auth-wrap"><div class="auth-aside"><span class="eyebrow">YOUR REFIND ACCOUNT</span><h1>Make room for<br><em>happy reunions.</em></h1><p>Keep your reports and notifications together in one place.</p></div><form class="form-card" method="post"><h2>Create account</h2><p class="muted">It only takes a minute.</p><label>Full name<input name="name" required autocomplete="name" placeholder="Your name"></label><label>Email address<input name="email" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input name="password" type="password" minlength="6" required autocomplete="new-password" placeholder="At least 6 characters"></label><button class="btn primary full" type="submit">Create account</button><p class="form-foot">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></form></section>{% endblock %}
