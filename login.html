{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block content %}<section class="auth-wrap"><div class="auth-aside"><span class="eyebrow">WELCOME BACK</span><h1>Your next clue<br>could be <em>here.</em></h1><p>Log in to check reports, matches, and new notifications.</p></div><form class="form-card" method="post"><h2>Log in</h2><p class="muted">Continue to your REFIND dashboard.</p><label>Email address<input name="email" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input name="password" type="password" required autocomplete="current-password" placeholder="Your password"></label><button class="btn primary full" type="submit">Log in</button><p class="form-foot">New to REFIND? <a href="{{ url_for('register') }}">Create an account</a></p></form></section>{% endblock %}
